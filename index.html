<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Xem Video Nhận Coin</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 30px 24px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        h2 {
            color: #FFD700;
            font-size: 28px;
            margin-bottom: 12px;
        }
        .reward-badge {
            background: #FFA500;
            color: #1a1a2e;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .info {
            color: #ccc;
            font-size: 15px;
            margin: 20px 0;
            line-height: 1.5;
        }
        .btn-watch {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            border: none;
            padding: 16px 32px;
            font-size: 20px;
            font-weight: bold;
            color: #1a1a2e;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 16px 0;
            box-shadow: 0 5px 15px rgba(255,165,0,0.4);
        }
        .btn-watch:active {
            transform: scale(0.97);
        }
        .status {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 12px;
            font-size: 14px;
            color: #fff;
            margin-top: 16px;
        }
        .footer {
            font-size: 12px;
            color: #888;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="reward-badge">🎁 THƯỞNG +8 TIẾNG ĐÀO</div>
        <h2>XEM VIDEO REWARDS</h2>
        <div class="info">
            ⚡ Sau khi xem xong, bạn sẽ được <strong>+8 giờ đào coin</strong> với tốc độ hiện tại.<br>
            📌 Có thể xem nhiều lần để cộng dồn (tối đa 24h).
        </div>
        <button class="btn-watch" id="watchBtn">▶ XEM VIDEO NGAY</button>
        <div class="status" id="status">🔘 Sẵn sàng</div>
        <div class="footer">💰 KIẾM COIN CỰC NHANH</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // THAY BLOCK ID CỦA MÀY VÀO ĐÂY
        const BLOCK_ID = "34005";
        let adController = null;

        async function initAd() {
            try {
                adController = window.Adsgram.init({
                    blockId: BLOCK_ID,
                    debug: false,
                    debugBannerType: "RewardedVideo"
                });
                document.getElementById('status').innerHTML = '✅ Sẵn sàng. Bấm nút để xem video.';
                document.getElementById('status').style.background = 'rgba(0,200,0,0.3)';
            } catch(e) {
                console.error(e);
                document.getElementById('status').innerHTML = '⚠️ Không thể tải quảng cáo. Thử lại sau.';
                document.getElementById('status').style.background = 'rgba(255,0,0,0.3)';
            }
        }

        document.getElementById('watchBtn').onclick = async () => {
            if (!adController) {
                document.getElementById('status').innerHTML = '⏳ Đang khởi tạo quảng cáo...';
                await initAd();
                if (!adController) return;
            }
            document.getElementById('status').innerHTML = '📺 Đang phát video, vui lòng xem hết.';
            document.getElementById('status').style.background = 'rgba(255,165,0,0.4)';
            try {
                await adController.show();
                // Xem thành công
                document.getElementById('status').innerHTML = '🎉 XEM XONG! +8 TIẾNG ĐÀO. Đóng cửa sổ này...';
                document.getElementById('status').style.background = 'rgba(0,200,0,0.3)';
                tg.sendData(JSON.stringify({ action: 'reward', reward: 8 }));
                setTimeout(() => tg.close(), 2000);
            } catch (e) {
                document.getElementById('status').innerHTML = '❌ Bạn chưa xem hết video hoặc có lỗi. Thử lại!';
                document.getElementById('status').style.background = 'rgba(255,0,0,0.3)';
                tg.sendData(JSON.stringify({ action: 'skip' }));
            }
        };

        initAd();
    </script>
</body>
</html>
